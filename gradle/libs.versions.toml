[versions]
# AGP 9 bundles its own Kotlin Gradle plugin (KGP). `kotlin` below must match the
# version AGP ships, or the Compose compiler plugin will conflict. AGP 9.4.1 -> KGP 2.2.10.
agp = "9.4.1"
kotlin = "2.2.10"

# Compose 1.12+ requires compileSdk 37 (see app/build.gradle.kts).
composeBom = "2026.09.00"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
media3 = "1.11.1"
kotlinxSerialization = "1.9.0"
junit = "4.13.2"

# YouTube Music streaming. InnerTubeX mints stream URLs and PoTokens; Ktor is
# its HTTP layer; Rhino runs the BotGuard proof-of-origin JS the PoToken needs.
innerTubeX = "v0.7.0"
ktor = "3.5.2"
rhino = "1.8.1"
okhttp = "5.3.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { module = "junit:junit", version.ref = "junit" }

# ---- YouTube Music ----
innerTubeX = { module = "com.github.MetrolistGroup.innertubex:innertubex-android", version.ref = "innerTubeX" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
rhino-engine = { module = "org.mozilla:rhino-engine", version.ref = "rhino" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
